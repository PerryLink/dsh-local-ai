name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: |
          pnpm run typecheck:ci
          pnpm test
          pnpm run build
          pnpm run verify:self-contained
          pnpm run verify:artifacts
          node scripts/check-readme-sync.mjs

      - name: Verify the changelog names this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "## \[${VERSION}\]" CHANGELOG.md || { echo "CHANGELOG.md has no '## [${VERSION}]' section"; exit 1; }

      # Trusted publishing: the OIDC token (id-token: write above) replaces the
      # long-lived NPM_TOKEN, so the publish step no longer reads any secret. npm
      # >= 11.5.1 is required for the exchange, which is what the upgrade step is
      # for; `registry-url` from setup-node stays (OIDC overrides the auth line).
      # NOTE: the previous version skipped the publish when NPM_TOKEN was empty -
      # that guard is gone on purpose, or removing the secret would have turned
      # this step into a silent no-op.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Publish to npm
        run: |
          npm --version
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-local-ai@${version}" version >/dev/null 2>&1; then
            echo "dsh-local-ai@${version} is already published; skipping npm publish"
          else
            npm publish --access public --provenance
          fi

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
