packages:
  - .

nodeLinker: hoisted
onlyBuiltDependencies:
  - esbuild
  - koffi
  - node-pty
# The 0.1.1-rc.2 peer family was published inside the registry's
# minimum-release-age window; exclude the whole harness scope so installs
# resolve regardless of release age.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  esbuild: true
  koffi: true
  node-pty: true
verifyDepsBeforeRun: false
