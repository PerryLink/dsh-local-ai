packages:
  - .

nodeLinker: hoisted
onlyBuiltDependencies:
  - esbuild
  - koffi
  - node-pty
# The 0.1.0-rc.8 peer family was published inside the registry's
# minimum-release-age window; pin it explicitly so installs resolve.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/dsh-commands@0.1.0-rc.8'
  - '@deepseek-ai/dsh-llm@0.1.0-rc.8'
  - '@deepseek-ai/dsh-session@0.1.0-rc.8'
  - '@deepseek-ai/dsh-subprocess@0.1.0-rc.8'
  - '@deepseek-ai/dsh-subprocess-local@0.1.0-rc.8'
  - '@deepseek-ai/dsh-system-prompt@0.1.0-rc.8'
  - '@deepseek-ai/dsh-timeout@0.1.0-rc.8'
  - '@deepseek-ai/dsh-tools@0.1.0-rc.8'
  - '@deepseek-ai/schemastery@3.18.1'
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  esbuild: true
  koffi: true
  node-pty: true
