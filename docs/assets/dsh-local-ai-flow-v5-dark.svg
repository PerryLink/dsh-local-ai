<marker id="arrdim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8b1c4"/></marker>
</defs>
<rect width="1100" height="660" fill="url(#bg)"/>
<text x="44" y="56" fill="#f0f3f9" font-family="'Consolas','SFMono-Regular','Menlo',ui-monospace,monospace" font-size="28" font-weight="700">dsh-local-ai</text>
