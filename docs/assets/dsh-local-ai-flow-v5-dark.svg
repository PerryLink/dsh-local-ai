<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-local-ai 结构图：llm/stream 瀑布读出 provider、purpose 与消息文本，route[] 按顺序首个命中后分叉到 ollama 或 openai:&lt;name&gt; 两条适配器通道，汇入同一个 StreamChunk；首个可见 delta 前的失败经 routeLocal 守卫回到 cloud；五个工具与 /ollama 另走管理通道">
